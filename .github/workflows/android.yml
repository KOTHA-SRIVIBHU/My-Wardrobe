name: Android app

# Every push checks the app and builds an APK (download it from the run's "Artifacts").
# Pushing a tag like v1.2.0 also publishes the APK as a GitHub Release, ready to share.
on:
  push:
    branches: [main, mobile-app]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  apk:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release on tags
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF_NAME#v}"; else name="1.0.${{ github.run_number }}"; fi
          echo "CLOSETIQ_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "CLOSETIQ_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "CLOSETIQ_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building a debug-signed APK instead."
          fi

      - name: Build APK
        working-directory: frontend/android
        env:
          CLOSETIQ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLOSETIQ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$CLOSETIQ_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ClosetIQ-$CLOSETIQ_VERSION_NAME.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/ClosetIQ-$CLOSETIQ_VERSION_NAME-debug.apk"
          fi
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: ClosetIQ-${{ env.CLOSETIQ_VERSION_NAME }}
          path: ${{ runner.temp }}/ClosetIQ-*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/ClosetIQ-*.apk \
            --repo "$GITHUB_REPOSITORY" --title "ClosetIQ $CLOSETIQ_VERSION_NAME" \
            --notes "Download the APK below on your Android phone and open it to install. First time? See INSTALL.md."
