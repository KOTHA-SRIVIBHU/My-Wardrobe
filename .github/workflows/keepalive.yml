# Optional. Free Supabase projects pause after a week without activity; this pings the
# API once a day (the deep health check runs a database query), which prevents that.
# It uses ~30 GitHub Actions minutes a month.
#
# Render's free service also sleeps after ~15 idle minutes. Keeping *that* awake needs a
# ping every few minutes, which is better done by a free uptime monitor (see DEPLOY.md)
# than by Actions minutes.
#
# To enable: GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables,
# add API_URL = https://<your-service>.onrender.com   (no trailing slash)
name: Keep database awake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 30 "${{ vars.API_URL }}/api/health?deep=true"
